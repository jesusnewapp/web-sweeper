<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07110f"><title>Inquiry</title><link rel="stylesheet" href="styles.css"></head>
<body><div class="glow one"></div><div class="glow two"></div><main>
<header><div><p class="eyebrow">WEB SWEEPER · COLLECTION INQUIRY</p><h1>Find the signal.<br><em>Open the work.</em></h1><p class="lede">One smooth view across your staged and live archive.</p></div><div id="health" class="health"><i></i> Connecting</div></header>
<section class="search-panel"><label class="wide"><span>Inquiry</span><input id="q" type="search" placeholder="Title, author, subject, phrase…" autofocus></label><label><span>Scope</span><select id="scope"><option value="all">Staged + live</option><option value="staged">Staged</option><option value="live">Live</option></select></label><label><span>Author</span><input id="author" placeholder="Any author"></label><label><span>Date from</span><input id="from" inputmode="numeric" placeholder="e.g. 1700"></label><label><span>Date to</span><input id="to" inputmode="numeric" placeholder="e.g. 1930"></label><label><span>Category</span><select id="category"><option value="">All categories</option></select></label><label><span>Pipeline stage</span><select id="stage"><option value="">Every stage</option></select></label><label><span>Custom field</span><select id="field"><option value="">Choose field</option></select></label><label><span>Custom value</span><input id="value" placeholder="Your metadata value"></label></section>
<section class="bar"><div><strong id="count">0</strong><span> works in view</span></div><button id="clear">Reset inquiry</button></section><section id="results" class="grid" aria-live="polite"></section>
</main><dialog id="viewer"><button class="close" aria-label="Close">×</button><div id="viewerBody"></div></dialog><script src="app.js"></script></body></html>
